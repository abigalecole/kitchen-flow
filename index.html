<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E6A4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitchen Flow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Kitchen Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one-screen phone app — sticky header, scrolling list, fixed bottom tab bar that shows the loop List → Pantry → Plan → Cook */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --ink:#1B2420; --muted:#5E6B64; --line:#DCE3DD;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --accent-soft:#E0EDE5;
  --out:#B23A2D; --out-soft:#F8E4E0; --warn:#9A6200; --warn-soft:#F7EDD6;
  --shadow:0 10px 30px rgba(20,40,30,.18);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A211D; --ink:#E5ECE7; --muted:#97A59D; --line:#2A3430;
  --accent:#7DC49D; --accent-ink:#0D1A12; --accent-soft:#1E3327;
  --out:#F08B7E; --out-soft:#3A201C; --warn:#E5B55A; --warn-soft:#352A15;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A211D; --ink:#E5ECE7; --muted:#97A59D; --line:#2A3430;
  --accent:#7DC49D; --accent-ink:#0D1A12; --accent-soft:#1E3327;
  --out:#F08B7E; --out-soft:#3A201C; --warn:#E5B55A; --warn-soft:#352A15;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 96px;max-width:640px;margin:0 auto;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.top h1{font-family:var(--display);font-size:28px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}

.sample{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-block:4px 12px}
.sample b{color:var(--warn)}

.addbar{display:flex;gap:8px;margin-block:4px 14px}
.addbar input,.addbar select{min-width:0;flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.addbar select{flex:0 0 auto;padding-inline:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.plain{background:transparent;color:var(--accent);padding-inline:8px}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.hint{font-size:13px;color:var(--muted)}

.section-h{display:flex;align-items:baseline;justify-content:space-between;margin-block:18px 6px}
.section-h h2{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.section-h span{font-size:13px;color:var(--muted)}

ul.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
ul.rows li{display:flex;align-items:center;gap:12px;padding:11px 12px;min-height:54px;border-top:1px solid var(--line)}
ul.rows li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.name{font-weight:700;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);background:transparent;flex:0 0 auto;display:grid;place-items:center;padding:0}
.check svg{opacity:0}
.check.on{background:var(--accent)}
.check.on svg{opacity:1}
li.leaving{transition:opacity .35s, transform .35s;opacity:0;transform:translateX(40px)}
@media (prefers-reduced-motion: reduce){li.leaving{transition:none}}
.x{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;flex:0 0 auto;font-size:20px;line-height:1}

.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.stepper button{border:0;background:var(--accent-soft);color:var(--accent);width:34px;height:34px;font-size:20px;font-weight:700;line-height:1}
.stepper span{min-width:64px;text-align:center;font-size:14px;padding-inline:4px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;border:0;white-space:nowrap}
.chip.loc{background:var(--accent-soft);color:var(--accent)}
.chip.out{background:var(--out-soft);color:var(--out)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
li.isout .name{color:var(--muted);text-decoration:line-through}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-block:4px 4px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.rcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rcard h3{font-family:var(--display);font-size:19px;margin:0 0 4px;line-height:1.2}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-block:10px 6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.miss{font-size:13px;color:var(--muted)}
.miss b{color:var(--out);font-weight:700}

.ask{background:var(--accent-soft);border-radius:14px;padding:14px;margin-block:4px 14px;display:grid;gap:10px}
.ask p{margin:0;font-size:14px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.idea h4{margin:0;font-family:var(--display);font-size:17px}

.week{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:4px 10px}
.week strong{font-family:var(--display);font-size:17px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.day.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.day-h b{font-family:var(--display);font-size:16px}
.slot{display:block;padding-block:8px;border-top:1px solid var(--line)}
.slot .lbl{display:block;margin-bottom:4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.slot .add{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px 12px;color:var(--muted);width:100%;text-align:left}
.slot .meal{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:4px 0}
.slot-items{display:grid;gap:6px}
.slot-item{display:flex;align-items:center;gap:8px}
.slot-item.done .name{text-decoration:line-through;color:var(--muted)}
.prep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.prep-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prep-h h2{font-family:var(--display);font-size:19px;margin:0}
.readyrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
ul.tasks{list-style:none;margin:8px 0 0;padding:0}
ul.tasks li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
ul.tasks li:first-child{border-top:0}
ul.tasks li.done .name{text-decoration:line-through;color:var(--muted)}
.search{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;margin-block:4px 10px}
.sheet .search{background:var(--bg)}
.spaceRow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.spaceRow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);font-size:16px}
.cat{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
label.field select{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);font-size:16px;font-weight:400;color:var(--ink);width:100%}
.inline-select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);font-size:15px;color:var(--ink)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto}
nav.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:12px;font-weight:700;position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;min-width:18px;height:18px;padding-inline:5px;display:grid;place-items:center}
nav.tabs .arrow{position:absolute;right:-6px;top:14px;color:var(--line);font-size:12px}

.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-family:var(--display);font-size:24px;margin:0 0 4px;line-height:1.15;text-wrap:balance}
.sheet .meta{color:var(--muted);font-size:14px;margin-bottom:12px}
.ing{list-style:none;padding:0;margin:0 0 14px}
.ing li{display:flex;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.dot.have{background:var(--accent)} .dot.low{background:var(--warn)} .dot.miss{background:var(--out)} .dot.staple{background:var(--line)}
.steps{white-space:pre-wrap;font-size:15px;background:var(--bg);border-radius:12px;padding:12px;margin-bottom:14px}
.actions{display:grid;gap:8px}
.actions.two{grid-template-columns:1fr 1fr}
label.field{display:grid;gap:4px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--muted)}
label.field input,label.field textarea{min-width:0;width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);font-size:16px;font-weight:400;color:var(--ink)}
label.field textarea{min-height:120px;resize:vertical}
.toggle{display:flex;align-items:center;gap:10px;padding-block:10px;font-size:15px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

.nutr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.nutr div{background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center}
.nutr b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.nutr span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.src{font-size:12px;color:var(--muted);margin-bottom:12px}
.status{font-size:14px;color:var(--muted);margin-block:4px 10px}
.status.err{color:var(--out)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.mf-card{background:#FFFFFF;color:#111111;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;font-size:15px;line-height:1.5}
.mf-card h3{margin:0 0 2px;font-size:20px;font-family:var(--display)}
.mf-card ul{margin:8px 0 10px;padding-left:20px}
.mf-card p{margin:0}
.season{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;margin:0 auto;max-width:600px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:var(--shadow);font-size:15px}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
.sheet .section-h h2{font-size:13px;margin:0}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-block:4px 12px}
.linkname{border:0;background:transparent;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.usebanner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-block:4px 6px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;font-size:24px;line-height:1;padding:2px;color:var(--line)}
.stars button.on{color:var(--warn)}
.fav{border:0;background:transparent;font-size:22px;padding:4px;color:var(--muted)}
.fav.on{color:var(--out)}
.timers{position:sticky;top:-8px;z-index:2;background:var(--surface);padding:6px 0;display:grid;gap:6px}
.timer{display:flex;justify-content:space-between;align-items:center;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:15px}
.timer.done{background:var(--warn-soft)}
.timer b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.tl-step{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tl-step:first-child{border-top:0}
.tl-time{flex:0 0 52px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:4px}
.tl-step.done .name{text-decoration:line-through;color:var(--muted)}
#timerBar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:9;max-width:640px;margin:0 auto;padding:0 16px 6px}
.timerbar-btn{width:100%;border:0;background:transparent;padding:0;text-align:left;display:grid;gap:4px}
.more{margin-top:4px;font-size:14px}
.more summary{color:var(--accent);font-weight:700;cursor:pointer;padding:2px 0}
.detail{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.detail li{margin:2px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.loglist{font-size:13px;color:var(--muted);max-height:160px;overflow:auto;margin:6px 0 10px;padding-left:18px}
.storeh{font-family:var(--display);font-size:22px;margin:22px 0 2px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:4px}
.storeh.unsorted{border-bottom-color:var(--warn);color:var(--warn)}
.storeh .num{font-size:14px;color:var(--muted);font-family:var(--body)}
.gear{border:0;background:transparent;color:var(--muted);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;padding:0}
.top-right{display:flex;align-items:center;gap:6px}
#auth{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 20px 40px}
#auth .card{max-width:420px;margin:0 auto;display:grid;gap:4px}
#auth h1{font-family:var(--display);font-size:34px;line-height:1.05;margin:6px 0 6px}
#auth p.lead{color:var(--muted);margin:0 0 18px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;padding:8px 0;text-align:left}
input[type=file]{font-size:14px}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="brand">Kitchen Flow</div>
    <h1 id="title">Grocery list</h1>
  </div>
  <div class="top-right"><div class="sync" id="sync">On this device</div>
  <button class="gear" data-act="settings" aria-label="Settings and account"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</header>

<main id="main"></main>

<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="timerBar" hidden></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<div id="auth" hidden></div>

<script src="firebase-config.js"></script>
<script>
(() => {
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const KEY = "kitchen-flow-v1";

const UNIT_ALIASES = {lb:"lb",lbs:"lb",pound:"lb",pounds:"lb",oz:"oz",ounce:"oz",ounces:"oz",g:"g",gram:"g",grams:"g",kg:"kg",ml:"ml",l:"l",liter:"l",cup:"cup",cups:"cup",tbsp:"tbsp",tablespoon:"tbsp",tablespoons:"tbsp",tsp:"tsp",teaspoon:"tsp",teaspoons:"tsp",can:"can",cans:"can",jar:"jar",jars:"jar",box:"box",boxes:"box",bag:"bag",bags:"bag",bunch:"bunch",bunches:"bunch",clove:"clove",cloves:"clove",dozen:"dozen",pkg:"pkg",pack:"pack",packs:"pack",bottle:"bottle",bottles:"bottle",loaf:"loaf",loaves:"loaf",head:"head",heads:"head",slice:"slice",slices:"slice",stick:"stick",sticks:"stick",gallon:"gallon",gallons:"gallon",carton:"carton",cartons:"carton"};
const STAPLES = new Set(["salt","pepper","black pepper","water","salt and pepper","kosher salt","flaky salt","sea salt","cold water","freshly ground black pepper"]);

function parseNum(t){
  if (/^\d+\/\d+$/.test(t)) { const [a,b] = t.split("/").map(Number); return b ? a/b : null; }
  if (/^\d*\.?\d+$/.test(t)) return Number(t);
  const F = {"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3};
  const mixed = t.match(/^(\d+)([½¼¾⅓⅔])$/); if (mixed) return +mixed[1] + F[mixed[2]];
  return F[t] ?? null;

/* ---------- nutrition ---------- */
const nf = n => Math.round(Number(n)||0).toLocaleString();

/* ---------- paste a recipe ---------- */
function titleCase(t){ return t === t.toUpperCase() ? t.toLowerCase().replace(/(^|[\s(\/-])(\p{L})/gu, (m, a, c) => a + c.toUpperCase()).replace(/\b(With|And|Or|Of|The|A|In|On|For|To|En)\b(?!$)/g, w => w.toLowerCase()).replace(/^./, c => c.toUpperCase()) : t; }
function cleanIngredient(l){
  l = l.replace(/^(high[- ]smoke[- ]point|good[- ]quality|extra[- ]virgin),\s*/i, "");
  l = l.replace(/^(an?|one)\s+(?=[\d½¼¾⅓⅔])/i, "");
  return l.replace(/\\/g, "").replace(/^[-•*▢☐□]\s*/, "").replace(/\([^)]*\)/g, " ")
    .replace(/\b(large|medium|small)\s+or\s+[\d½¼¾⅓⅔]+\s+(large|medium|small)\s+/i, "").replace(/,.*$/, "").replace(/\bplus more.*$/i, "").replace(/\s+/g, " ").trim();
}
function parseRecipeText(text){
  text = splitTitleLine(text);
  const lines = String(text).replace(/\r/g, "").split("\n").map(l => l.replace(/\\/g, "").trim());
  const filled = lines.filter(Boolean);
  let ni = 0;
  if (/^(spring|summer|fall|winter)\s+\d{4}/i.test(filled[0] || "") && filled[1]) ni = 1;
  let name = filled[ni] || "";
  // titles in capitals often wrap onto a second line: "JALAPEÑO CHEDDAR SKEWERS" / "WITH BAKED POTATOES"
  while (name === name.toUpperCase() && filled[ni + 1] && filled[ni + 1] === filled[ni + 1].toUpperCase() && /[A-Z]{3}/.test(filled[ni + 1]) && !/^(INGREDIENTS|INSTRUCTIONS|MAKES|SERVES)\b/.test(filled[ni + 1])) { ni++; name += " " + filled[ni]; }
  name = titleCase(name.replace(/\s*-\s*Google Docs\s*$/i, ""));
  const sv = String(text).match(/\b(?:makes|serves|servings?:?)\s+(\d+)/i);
  const iIdx = lines.findIndex(l => /^ingredients\b/i.test(l));
  const sIdx = lines.findIndex((l, i) => i > iIdx && /^(instructions|directions|method|steps|preparation)\b/i.test(l));
  let ingRaw;
  if (iIdx >= 0) ingRaw = lines.slice(iIdx + 1, sIdx > iIdx ? sIdx : undefined);
  else ingRaw = lines.slice(1, sIdx > 0 ? sIdx : undefined).filter(l => /^[\d½¼¾⅓⅔]/.test(l));
  // a line with an unclosed "(" continues on the next line
  ingRaw = ingRaw.reduce((out, l) => {
    const prev = out[out.length - 1];
    if (prev != null && (prev.match(/\(/g) || []).length > (prev.match(/\)/g) || []).length) out[out.length - 1] = prev + " " + l;
    else out.push(l);
    return out; }, []);
  const ingredients = ingRaw.filter(l => l && !/:$/.test(l) && !(l === l.toUpperCase() && /[A-Z]{3}/.test(l)) && !/^(makes|serves)\b/i.test(l) && !/^\*/.test(l) && !/prepped ahead|^notes?\b/i.test(l))
    .map(cleanIngredient).filter(l => l.length > 1).map(l => { const p = parseLine(l); p.name = p.name.toLowerCase(); return p; }).filter(p => p.name);
  let stepLines = sIdx >= 0 ? lines.slice(sIdx + 1).filter(Boolean) : [];
  if (stepLines.some(l => /^\d+[.)]\s/.test(l))) stepLines = stepLines.reduce((out, l) => {
    if (/^\d+[.)]\s/.test(l) || !out.length || /^[A-Z][A-Z ]+:?$/.test(l)) out.push(l); else out[out.length - 1] += " " + l;
    return out; }, []);
  const steps = stepLines.join("\n").replace(/\s(\d{1,2})\.\s(?=[A-Z])/g, "\n$1. ").replace(/ +([,.])/g, "$1");
  return { name, servings: sv ? +sv[1] : null, time: "", ingredients, steps };
}

/* ---------- add from link ---------- */
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } }
function decodeEntities(t){ const el = document.createElement("textarea"); el.innerHTML = String(t ?? ""); return el.value; }
const stripTags = t => decodeEntities(String(t ?? "").replace(/<[^>]*>/g, " ")).replace(/\s+/g, " ").trim();
function isoDuration(d){
  const m = String(d || "").match(/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);
  if (!m) return "";
  const mins = (+m[1] || 0) * 1440 + (+m[2] || 0) * 60 + (+m[3] || 0);
  if (!mins) return "";
  const h = Math.floor(mins / 60), mm = mins % 60;
  return [h ? `${h} hr` : "", mm ? `${mm} min` : ""].filter(Boolean).join(" ");
}
function flattenSteps(x){
  if (!x) return [];
  if (typeof x === "string") return stripTags(x).split(/\s*\n+\s*/).filter(Boolean);
  if (Array.isArray(x)) return x.flatMap(flattenSteps);
  if (x.itemListElement) { const head = x.name ? [stripTags(x.name) + ":"] : []; return head.concat(flattenSteps(x.itemListElement)); }
  return x.text ? [stripTags(x.text)] : x.name ? [stripTags(x.name)] : [];
}

    .map(l => { const p = parseLine(l); p.name = p.name.toLowerCase(); return p; }).filter(p => p.name);

  let steps = flattenSteps(ld.recipeInstructions);
  let i = 0; steps = steps.map(t => /:$/.test(t) ? t : `${++i}. ${t.replace(/^\d+[.)]\s*/, "")}`);
  return { name: stripTags(ld.name) || "Untitled recipe", servings: firstNum(ld.recipeYield), time: isoDuration(ld.totalTime || ld.cookTime), ingredients, steps: steps.join("\n"), nutr: n, url };
}

const DRIVE_SCOPES = "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file";

function loadScript(src){ return new Promise((ok, bad) => { const el = document.createElement("script"); el.src = src; el.async = true; el.onload = ok; el.onerror = bad; document.head.appendChild(el); }); }
function initGoogle(){

      },

async function gfetch(url, opts = {}){

  if (res.status === 401) { G.token = null; throw {msg: "Your Google sign-in expired. Tap again to reconnect."}; }
  if (!res.ok) {
    let j = {}; try { j = await res.json(); } catch {}
    const reason = j?.error?.errors?.[0]?.reason || j?.error?.status || "";
    if (/accessNotConfigured|SERVICE_DISABLED/i.test(reason) || /has not been used|is disabled/i.test(j?.error?.message || ""))
      throw {msg: "The Google Drive API is turned off in your Google Cloud project. Turn it on (setup guide, step 5.1) and try again."};
    if (res.status === 404) throw {code: 404, msg: "That file isn't in your Drive anymore."};
    if (res.status === 403) throw {msg: "Google Drive said no to that request. " + (j?.error?.message || "")};
    throw {msg: "Google Drive didn't respond. Try again in a moment."};

const DAPI = "https://www.googleapis.com/drive/v3/files";

let pdfjsReady = null;

async function pdfText(buf){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: buf}).promise;
  let out = "";
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    let lastY = null, lastEnd = null;
    for (const it of tc.items) {
      const x = it.transform ? it.transform[4] : null, y = it.transform ? it.transform[5] : null, h = Math.abs(it.transform ? it.transform[3] : 10) || 10;
      if (it.str && lastY != null && y != null && Math.abs(y - lastY) > h * 0.6 && !out.endsWith("\n")) out += "\n";
      else if (lastEnd != null && x != null && x - lastEnd > h * 0.15 && it.str && !/\s$/.test(out) && !/^\s/.test(it.str)) out += " ";
      out += it.str;
      if (it.hasEOL) out += "\n";
      if (it.str) { lastY = y; lastEnd = x != null ? x + (it.width || 0) : null; }

}
const isTitle = l => l.length > 4 && /[A-Z]{3}/.test(l) && l === l.toUpperCase() && !/^[\d½¼¾⅓⅔]/.test(l) && !/^(INGREDIENTS|INSTRUCTIONS|DIRECTIONS|NOTES?|TO COOK|STEPS)\b/.test(l);
const splitTitleLine = t => String(t).replace(/^([^a-z\n]{4,}?)\s+((?:Makes|Serves|Yield)\b[^\n]*)$/gm, "$1\n$2");
function splitRecipes(text){
  const lines = splitTitleLine(text).replace(/\r/g, "").split("\n").map(l => l.replace(/\s+/g, " ").trim())
    .filter(l => !/google docs\s*$|^\d+\s*\/\s*\d+$|^https?:\/\/|^\d{1,2}\/\d{1,2}\/\d{2,4}/i.test(l));

    if (!next.some(n => /^(makes|serves|yield)\b/i.test(n) || /^ingredients\b/i.test(n))) return;

        const byName = Object.fromEntries(files.filter(isDocFile).map(f => [f.name, f]));
        if (csv) {
          const rows = parseCsv(await (await gfetch(`${DAPI}/${csv.id}?alt=media`)).text());
          for (const [file, post] of rows.slice(1)) { const f = byName[file]; if (f && post) (extra[menuKey(post)] ||= []).push(f); }
        }

    }
    const index = (await libIndex(true)) || {menus: []};
    const known = Object.fromEntries((index.menus || []).map(m => [m.id, m]));
    const vocab = baseVocab();
    let done = 0, made = 0, skipped = 0;
    for (const folder of menus) {
      if (IMP.stop) break;
      done++;
      if (known[folder.id] && !opts.redo) { skipped++; continue; }
      say(`Menu ${done} of ${menus.length}: ${folder.name}`);
      try {
        const m = await importMenu(folder, extra[menuKey(folder.name)] || [], vocab, t => say(`Menu ${done} of ${menus.length}: ${folder.name} · ${t}`));
        if (!m.recipes.length) { say(s.progress, `${folder.name}: no recipes found, skipped`); continue; }

        known[folder.id] = {id: folder.id, name: m.name, season: m.season, mains: m.recipes.filter(r => r.main).map(r => r.name),
          recipes: m.recipes.map((r, i) => ({i, name: r.name, cat: r.cat})), prep: m.prep.length, grocery: m.grocery.length};
        made++;

      } catch (e) {
        if (e && e.msg && /expired|turned off/i.test(e.msg)) throw e;

    const loose = extra["__loose"] || [];
    if (loose.length && !IMP.stop && (!known["__loose"] || opts.redo)) {

      const recipes = (await pool(loose, 3, async f => { try { return pickRecipe(await fileText(f), f.name); } catch { return null; } })).filter(Boolean)
        .map(r => ({...r, cat: guessCat(r.name), main: guessCat(r.name) === "Main", desc: ""}));
      if (recipes.length) {
        const m = {id: "__loose", name: "More recipes", season: "", recipes, prep: [], grocery: [], key: {}, loose: true, importedAt: Date.now()};
        await sync.fb.setDoc(libDoc("m-__loose"), m); LIB.menus["__loose"] = m;
        known["__loose"] = {id: "__loose", name: m.name, season: "", mains: [], recipes: recipes.map((r, i) => ({i, name: r.name, cat: r.cat})), prep: 0, grocery: 0, loose: true};
      }
    }
    await sync.fb.setDoc(libDoc("index"), {menus: Object.values(known), updated: Date.now()});
    LIB.index = {menus: Object.values(known)}; LIB.all = null;
    s.done = true;
    say(IMP.stop ? `Stopped. ${made} menus added so far; run it again to continue.` : `Done. ${made} menus added${skipped ? `, ${skipped} already in the library` : ""}. The library has ${Object.values(known).filter(m => !m.loose).length} menus.`);
  } catch (e) {
    console.warn("Library import failed", e);
    s.err = true; say(e.msg || (e.code === "permission-denied" ? "Your database rules don't allow the library yet. Update firestore.rules (setup guide, step 7) and try again." : "The import stopped. Run it again to continue where it left off."));
  }
  IMP.running = false; keepAwake(false);
  if (ui.sheet === s) renderSheet();
}
async function importMenu(folder, extraFiles, vocab, step){

  const recipeFolders = sub.filter(k => !LIST_FOLDER.test(k.name.trim()));

    const files = (await driveChildren(rf.id)).filter(isDocFile);
    for (const f of files) { const t = await textOf(f); if (!t) continue; addWords(vocab, t, 3); const r = pickRecipe(t, rf.name); if (r) return r; }
    return null;
  })).filter(Boolean);
  for (const f of extraFiles) {
    const t = await textOf(f); if (!t) continue; addWords(vocab, t, 3);
    const r = pickRecipe(t, f.name);
    if (r && !recipes.some(x => similarity(x.name, r.name) > 0.8)) recipes.push(r);

  recipes.forEach(r => addWords(vocab, r.name, 6));

  const pick = rx => Object.entries(listTexts).filter(([k]) => rx.test(k)).flatMap(([, v]) => v);

  let sources = Object.entries(listTexts).flatMap(([name, arr]) => arr.map(t => ({kind: kindOf(name), text: fixText(t, vocab)})));
  const has = k => sources.some(x => x.kind === k);
  if (has("prep") && has("grocery")) sources = sources.filter(x => x.kind !== "mixed" || !has("menu"));
  if (!sources.length && consolidatedRecipes.length) sources = consolidatedRecipes.filter(t => /PREP LIST|GROCERY LIST/.test(t)).map(t => ({kind: "mixed", text: fixText(t, vocab)}));
  const parts = sources.map(x => parseLists(x.text, x.kind));
  const pickP = (k, field) => { const own = sources.map((x, i) => x.kind === k ? parts[i][field] : []).flat(); return own.length ? own : sources.map((x, i) => x.kind === "mixed" ? parts[i][field] : []).flat(); };

    grocery: pickP("grocery", "grocery").filter(g => { const k = norm(g.name); if (seenG.has(k)) return false; seenG.add(k); return true; }),
    menuLines: pickP("menu", "menuLines")};

  if (!mains.size) Object.values(L.key).forEach(label => { let b = -1, bs = 0.55; recipes.forEach((r, i) => { const sc = similarity(label, r.name); if (sc > bs) { bs = sc; b = i; } }); if (b >= 0) mains.set(b, ""); });
  if (!mains.size) recipes.forEach((r, i) => { if (guessCat(r.name) === "Main") mains.set(i, ""); });

  const out = recipes.map((r, i) => ({name: r.name, servings: r.servings || null, time: r.time || "", ingredients: r.ingredients, steps: r.steps || "",
    main: mains.has(i), desc: mains.get(i) || "", cat: mains.has(i) ? (guessCat(r.name) === "Main" ? "Main" : guessCat(r.name)) : (guessCat(r.name) === "Main" ? "Sauce & prep" : guessCat(r.name))}));

    recipes: out, prep, grocery, key: L.key, src: {modified: folder.modifiedTime || ""}, importedAt: Date.now()};

  if (JSON.stringify(doc).length > 900000) doc.recipes.forEach(r => { r.steps = r.steps.slice(0, 4000); });
  return doc;
}

function copyLibRecipe(m, i){

      const key = norm(ing.name) + "|" + ing.unit; (need[key] ||= {name: ing.name, unit: ing.unit, qty: 0}).qty += ing.qty * times; } }

function useMenu(m, o){

    } else {

    }

    tasks.push(...m.prep.filter(t => !have.has(t.text.toLowerCase())).map(t => ({id: uid(), text: t.text, detail: t.detail || [], for: t.for || m.name, night: NIGHT_BEFORE.test(t.text + " " + (t.detail || []).join(" ")), recipes: [], done: false})));
  }
  let comps = 0;

    const mainNames = m.recipes.filter(r => r.main);
    m.recipes.forEach((r, i) => {
      if (r.main) return;
      const link = {id: ids[i], name: r.name};
      // attach to the prep step that already says to make it ("see PDF ‘Honey Mustard Sauce’")
      const mentions = t => [t.text, ...(t.detail || [])].some(x => similarity(x.replace(/\(see[^)]*\)/i, ""), r.name) > 0.85 || new RegExp("‘" + r.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "’", "i").test(x));

      const usedBy = mainNames.filter(mr => (mr.ingredients || []).some(ing => similarity(ing.name, r.name) > 0.8)).map(mr => mr.name);

}

function addToGrocery(items){
  let added = 0;
  for (const it of items) {
    const ex = state.grocery.find(g => norm(g.name) === norm(it.name));
    if (ex) { const q = convert(it.qty, it.unit, ex.unit, it.name); if (q != null) ex.qty = Math.round((ex.qty + q) * 100) / 100; }
    else { state.grocery.push({id: uid(), name: it.name, qty: it.qty, unit: it.unit, sec: it.sec || secFor(it.name), store: it.store ?? storeForPlanned(it.name), ...(it.note ? {note: it.note} : {}), ...(it.auto ? {auto: true} : {})}); added++; }
  }
  return added;
}
const todayK = () => ymd(new Date());
const daysUntil = d => Math.round((new Date(d + "T12:00:00") - new Date(todayK() + "T12:00:00")) / 864e5);
const FREEZER_DAYS = 90; // about 3 months
function shelfDays(name, loc){

  if (COUNTER.some(k => n.includes(k))) return null;
  if (a === "Meat & fish") return 2;
  if (/egg/.test(n)) return 28;
  if (/milk|cream\b|buttermilk/.test(n)) return 7;
  if (/cheese|cheddar|parmesan|mozzarella/.test(n)) return 21;
  if (/yogurt|sour cream/.test(n)) return 14;
  if (a === "Produce") return /berr|spinach|lettuce|herb|cilantro|parsley|basil|mushroom/.test(n) ? 4 : 7;
  if (a === "Dairy & eggs") return 10;
  return null;
}

  if (!p.use || p.qty <= 0) return "";
  const d = daysUntil(p.use);
  const when = d < 0 ? `expired ${-d} day${d === -1 ? "" : "s"} ago` : d === 0 ? "use today" : d === 1 ? "use by tomorrow" : `use by ${new Date(p.use + "T12:00:00").toLocaleDateString(undefined, {weekday: "short"})}`;
  return `<span class="chip ${d < 0 ? "out" : d <= 2 ? "warn" : "loc"}">${d > 6 ? `use by ${new Date(p.use + "T12:00:00").toLocaleDateString(undefined, {month: "short", day: "numeric"})}` : when}</span>`;
}
const useSoon = (days = 2) => state.pantry.filter(p => p.qty > 0 && p.use && daysUntil(p.use) <= days);
function moveToPantry(g){
  const ex = state.pantry.find(p => norm(p.name) === norm(g.name));
  let item;
  if (ex) {
    const q = ex.qty <= 0 ? g.qty : convert(g.qty, g.unit, ex.unit, g.name);
    if (ex.qty <= 0) { ex.qty = g.qty; ex.unit = g.unit; ex.use = null; }
    else if (q != null) ex.qty = Math.round((ex.qty + q) * 100) / 100;
    else { item = {id: uid(), name: g.name, qty: g.qty, unit: g.unit, loc: locFor(g.name)}; state.pantry.push(item); }
    item ||= ex;
  } else { item = {id: uid(), name: g.name, qty: g.qty, unit: g.unit, loc: locFor(g.name)}; state.pantry.push(item); }
  if (!item.use) { const sd = shelfDays(item.name, item.loc); if (sd) item.use = ymd(addDays(new Date(), sd)); }
  delete item.listed;
  state.grocery = state.grocery.filter(x => x.id !== g.id);
  const key = norm(g.name);
  const h = (state.bought ||= {})[key] ||= {name: g.name, n: 0};
  h.n++; h.qty = g.qty; h.unit = g.unit; h.last = todayK();
}
// Staples: when stock falls below its minimum, add it to the list once.
function checkStaples(){
  let added = [];
  for (const p of state.pantry) {
    if (!p.min) continue;
    const low = p.qty < p.min;
    if (!low) { delete p.listed; continue; }
    if (p.listed || state.grocery.some(g => norm(g.name) === norm(p.name))) continue;
    addToGrocery([{name: p.name, qty: Math.max(1, Math.round((p.min - p.qty) * 100) / 100), unit: p.unit, auto: true}]);
    p.listed = true; added.push(p.name);
  }
  return added;
}
function buyAgainList(){
  const onList = new Set(state.grocery.map(g => norm(g.name)));
  return Object.entries(state.bought || {}).filter(([k, h]) => h.n >= 2 && !onList.has(k))
    .filter(([k]) => { const p = state.pantry.find(x => norm(x.name) === k); return !p || p.qty <= 0 || (p.min && p.qty < p.min); })
    .sort((a, b) => b[1].n - a[1].n || (b[1].last || "").localeCompare(a[1].last || "")).slice(0, 12).map(([k, h]) => ({key: k, ...h}));
}

function ageDays(d){ return Math.max(0, Math.round((new Date(ymd(new Date()) + "T12:00:00") - new Date(d + "T12:00:00")) / 864e5)); }
// Moving food in or out of the freezer resets its use-by date.
function relocate(p, newLoc, isPortion){
  const wasFrozen = isFreezer(p.loc); p.loc = newLoc;
  const nowFrozen = isFreezer(newLoc);
  if (isPortion) {
    if (nowFrozen && !wasFrozen) { p.frozen = todayK(); delete p.thawed; }
    else if (!nowFrozen && wasFrozen) { delete p.frozen; p.thawed = todayK(); }
    return;
  }
  if (nowFrozen && !wasFrozen) p.use = ymd(addDays(new Date(), FREEZER_DAYS));
  else if (!nowFrozen && wasFrozen) { const sd = shelfDays(p.name, newLoc); p.use = sd ? ymd(addDays(new Date(), sd)) : null; }
}
function portionSoon(p){
  if (isFreezer(p.loc)) return ageDays(p.frozen || p.made) >= FREEZER_DAYS - 7;
  return p.thawed ? ageDays(p.thawed) >= 2 : ageDays(p.made) >= 4;
}
function ageChip(p){
  const days = ageDays(p.made);
  if (isFreezer(p.loc)) {
    const start = p.frozen || p.made, left = FREEZER_DAYS - ageDays(start), until = new Date(addDays(new Date(start + "T12:00:00"), FREEZER_DAYS)).toLocaleDateString(undefined, {month: "short", day: "numeric"});
    return left <= 7 ? `<span class="chip ${left < 0 ? "out" : "warn"}">${left < 0 ? "Past 3 months frozen" : `Use soon · frozen until ${until}`}</span>` : `<span class="chip loc">Frozen · good until ${until}</span>`;
  }
  if (p.thawed) { const t = ageDays(p.thawed); return `<span class="chip ${t >= 2 ? "warn" : "loc"}">${t >= 2 ? "Use soon · " : ""}Thawed ${t === 0 ? "today" : t === 1 ? "yesterday" : `${t} days ago`}</span>`; }
  if (days >= 4) return `<span class="chip warn">Use soon · made ${days} days ago</span>`;
  return `<span class="chip loc">${days === 0 ? "Made today" : days === 1 ? "Made yesterday" : `Made ${days} days ago`}</span>`;
}

}
function renderPantry(){

/* ---------- meal prep ---------- */
const recipeById = id => state.recipes.find(x => x.id === id);
const weekKey = () => ymd(ui.weekStart);
const dayLabel = k => new Date(k + "T12:00:00").toLocaleDateString(undefined, {weekday: "short"});
function weekItems(){
  const out = [];
  for (let i = 0; i < 7; i++) {
    const k = ymd(addDays(ui.weekStart, i)), day = state.plan[k] || {};
    for (const m of MEALS) for (const it of day[m] || []) { const r = recipeById(it.r); if (r) out.push({k, m, it, r}); }
  }
  return out;
}
const portionsFor = rid => state.prepped.filter(p => p.r === rid).reduce((n, p) => n + p.portions, 0);
const NIGHT_BEFORE = /marinat|brine|soak|overnight/i;
function suggestPrep(){
  const items = weekItems().filter(x => !x.it.done);
  const tasks = [];
  const add = (text, extra) => {
    const ex = tasks.find(t => t.text.toLowerCase() === text.toLowerCase());
    if (ex) { if (extra.for && !ex.for.includes(extra.for)) ex.for += "; " + extra.for; return; }
    tasks.push({id: uid(), text, done: false, for: "", night: NIGHT_BEFORE.test(text), ...extra});
  };
  // Recipes planned more than once: cook one batch and portion it.
  const uses = {};
  items.forEach(x => (uses[x.r.id] ||= []).push(`${dayLabel(x.k)} ${x.m}`));
  for (const [rid, when] of Object.entries(uses)) {
    const need = when.length - portionsFor(rid);
    if (when.length < 2 || need <= 0) continue;
    const r = recipeById(rid), mult = Math.max(1, Math.ceil(need / (r.servings || need)));
    add(`Batch cook ${r.name}`, {for: `${need} portions for ${when.join(", ")}`, batch: rid, mult, portions: need, night: false});
  }
  for (const x of items) {
    if (portionsFor(x.r.id) >= (uses[x.r.id] || []).length) continue; // already prepped
    const batched = (uses[x.r.id] || []).length >= 2;
    const forLbl = batched ? `${x.r.name} (batch)` : `${dayLabel(x.k)} ${x.m} · ${x.r.name}`;
    const own = (x.r.prep || "").split("\n").map(t => t.trim()).filter(Boolean);
    if (own.length) { own.forEach(t => add(t, {for: forLbl})); continue; }
    const steps = (x.r.steps || "").toLowerCase(), ings = x.r.ingredients;
    const protein = ings.find(i => aisleFor(i.name) === "Meat & fish");
    if (/marinat/.test(steps) || ings.some(i => /marinade/i.test(i.name))) add(`Marinate ${protein ? protein.name : "the meat"}`, {for: forLbl, night: true});
    else if (/\bbrine/.test(steps)) add(`Brine ${protein ? protein.name : "the meat"}`, {for: forLbl, night: true});
    if (/\bsoak/.test(steps)) add(`Soak ${(ings.find(i => /bean|chickpea|lentil|oat/i.test(i.name)) || {name: "the beans"}).name}`, {for: forLbl, night: true});
    for (const i of ings) {
      const comp = state.recipes.find(r => r.id !== x.r.id && r.cat === "Sauce & prep" && norm(i.name).length > 3 && (norm(r.name).includes(norm(i.name)) || norm(i.name).includes(norm(r.name))));
      if (comp) add(`Make ${comp.name}`, {for: forLbl});
      else if (/sauce|dressing|vinaigrette|salsa|marinade|pickled|gremolata|seasoning|\btoum\b|pesto|aioli/i.test(i.name) && !/soy sauce|hot sauce|fish sauce|jarred|store-bought|worcestershire|sriracha|bbq|barbecue|pasta sauce|marinara/i.test(i.name))
        add(`Make ${i.name}`, {for: forLbl});
    }
    const grain = ings.find(i => /\b(rice|quinoa|farro|couscous|barley)\b/i.test(i.name));
    if (grain) add(`Cook ${grain.name.replace(/^cooked\s+/i, "")}`, {for: forLbl});
    if (/shred/.test(steps) && protein && /chicken|pork|beef/.test(protein.name)) add(`Cook and shred ${protein.name}`, {for: forLbl});
    if (/\b(chop|dice|mince|slice|julienne|shred)/.test(steps)) {
      const veg = ings.filter(i => aisleFor(i.name) === "Produce" && !/lime|lemon|avocado|cilantro|herb|parsley|dill|mint|basil|banana|apple|berr/i.test(i.name)).map(i => i.name).slice(0, 4);
      if (veg.length) add(`Chop ${veg.join(", ")}`, {for: forLbl});
    }
  }
  const have = new Set((state.prep[weekKey()] || []).map(t => t.text.toLowerCase()));
  return tasks.filter(t => !have.has(t.text.toLowerCase()));
}
function renderPrepCard(){
  const tasks = (state.prep[weekKey()] || []).slice().sort((a,b) => a.done - b.done || b.night - a.night);
  const ready = state.prepped.filter(p => p.portions > 0);
  const done = tasks.filter(t => t.done).length;
  let h = `<div class="prep"><div class="prep-h"><h2>Meal prep</h2>${tasks.length ? `<span class="sub num">${done} of ${tasks.length} done</span>` : ""}</div>`;
  if (ready.length) h += `<div class="readyrow">${ready.map(p => `<span class="chip ${portionSoon(p) ? "warn" : "ok"}">${esc(p.name)} · ${p.portions}</span>`).join("")}</div>`;

/* ---------- prep day timeline ---------- */
function minutesIn(t){ const m = String(t || "").match(/(\d+)\s*h(?:ou)?r/i), n = String(t || "").match(/(\d+)\s*min/i); return (m ? +m[1] * 60 : 0) + (n ? +n[1] : 0); }
function taskTime(t){
  const x = t.text.toLowerCase();
  if (t.night || /marinat|brine|soak/.test(x)) return {order: 0, active: 10, passive: 0, note: "Start first so it has time to sit"};
  if (t.batch) { const tot = minutesIn(recipeById(t.batch)?.time) || 45; return {order: 4, active: Math.min(20, tot), passive: Math.max(0, tot - 20), note: "After its ingredients are prepped"}; }
  const g = x.match(/^cook .*\b(rice|quinoa|farro|couscous|barley)\b/);
  if (g) return {order: 1, active: 5, passive: {rice: 20, quinoa: 15, farro: 30, couscous: 5, barley: 40}[g[1]]};
  if (/shred/.test(x)) return {order: 1, active: 10, passive: 25};
  const comp = state.recipes.find(r => x === ("make " + r.name.toLowerCase()));
  if (comp) { const tot = minutesIn(comp.time) || 10; return {order: 2, active: Math.min(15, tot), passive: Math.max(0, tot - 15)}; }
  if (/^make /.test(x)) return {order: 2, active: 10, passive: 0};
  if (/^chop /.test(x)) return {order: 3, active: 5 + 3 * (x.split(",").length), passive: 0};
  const mins = minutesIn(x) || 0, passive = /bake|roast|simmer|rest|chill|cool|slow cook|instant pot|boil/.test(x);
  return {order: 2, active: passive ? 5 : (mins || 10), passive: passive ? (mins || 20) : 0};
}
function buildTimeline(){
  const tasks = (state.prep[weekKey()] || []).filter(t => !t.done).map(t => ({t, ...taskTime(t)}));
  if (!tasks.length) return {steps: [], total: 0};
  // Night-before jobs, then long hands-off jobs, then hands-on jobs while those cook.
  tasks.sort((a, b) => a.order - b.order || b.passive - a.passive || b.active - a.active);
  let clock = 0, end = 0;
  const steps = tasks.map(x => { const start = clock; clock += x.active; end = Math.max(end, clock + x.passive); return {...x, start}; });
  if ((state.prep[weekKey()] || []).some(t => t.batch) || tasks.some(x => x.t.batch)) {
    const start = Math.max(clock, end); steps.push({t: {id: "pack", text: "Portion, label and put away", for: "Write the date on each container"}, active: 10, passive: 0, start}); end = start + 10;
  }
  return {steps, total: Math.max(clock, end)};
}

    g.gain.setValueAtTime(0.2, audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime + 0.6); } catch {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}

function cookRows(r, mult){
  return r.ingredients.filter(i => !STAPLES.has(i.name.toLowerCase()) && !STAPLES.has(norm(i.name))).map(i => {
    const p = findPantry(i.name), need = Math.round(i.qty * mult * 100) / 100;
    if (!p || p.qty <= 0) return {name: i.name};
    let use, note = "";
    const conv = convert(need, i.unit, p.unit, i.name);
    if (conv != null) { use = Math.min(conv, p.qty); if (p.unit !== i.unit) note = `recipe says ${qtyStr(need, i.unit)}`; }
    else if (!p.unit) use = Math.min(mult, p.qty);
    else { use = 0; note = `recipe says ${qtyStr(need, i.unit)}, set how much you used`; }
    return {pid: p.id, name: p.name, unit: p.unit, have: p.qty, use, note};
  });
}
function startCook(id, o = {}){
  const r = recipeById(id); if (!r) return;
  const mult = o.mult || 1;
  const portions = o.portions != null ? o.portions : o.batch ? (r.servings || 2) * mult : 0;
  openSheet({type: "cook", id, k: o.k, m: o.m, sid: o.sid, taskId: o.taskId, batch: !!o.batch, mult, portions, ploc: fridgeId(), rows: cookRows(r, mult), relist: true});
}
function pickListHtml(s){
  const q = (s.q || "").trim().toLowerCase(), cat = s.cat || "All";
  if (s.src === "lib") {
    if (!libReady()) return libSourceHtml("lib");
    if (!LIB.all) { if (!libAllLoading && !LIB.allErr) libAll().then(() => { if (ui.sheet === s) renderSheet(); }).catch(() => { LIB.allErr = "Couldn't load the library."; if (ui.sheet === s) renderSheet(); }); return `<div class="status">${esc(LIB.allErr || "Loading the menu library…")}</div>`; }
    const rows = libRows(q, cat).map(x => ({...x, m: recipeMatch(x.r)})).sort((a, b) => a.m.missing.length - b.m.missing.length || a.r.name.localeCompare(b.r.name));
    if (!rows.length) return `<div class="empty">No library recipes match${(LIB.all || []).length ? "" : ". The library is empty"}.</div>`;
    return rows.slice(0, 100).map(({mid, i, r, menu, m}) => `<button class="rcard" data-act="${s.mode === "batch" ? "batch-lib" : "assign-lib"}" data-m="${esc(mid)}" data-i="${i}"><div class="cat">${esc(r.cat || "")}${menu ? ` <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:400">· ${esc(menu)}</span>` : ""}</div><h3>${esc(r.name)}</h3>
      <div class="miss">${m.missing.length ? `Missing: <b>${esc(m.missing.slice(0, 5).map(x => x.name).join(", "))}${m.missing.length > 5 ? "…" : ""}</b>` : "You have everything."}</div></button>`).join("") + (rows.length > 100 ? `<p class="hint">Showing 100 of ${rows.length}. Search to narrow it down.</p>` : "");
  }
  const list = state.recipes.filter(r => (cat === "All" || r.cat === cat) && recipeMatchesQuery(r, q))
    .map(r => ({r, m: recipeMatch(r), por: portionsFor(r.id)}))
    .sort((a,b) => (b.por > 0) - (a.por > 0) || a.m.missing.length - b.m.missing.length || a.r.name.localeCompare(b.r.name));
  if (!list.length) return `<div class="empty">${state.recipes.length ? "No recipes match." : "Add a recipe on the Cook tab first."}</div>`;
  return list.map(({r,m,por}) => `<button class="rcard" data-act="${s.mode === "batch" ? "batch-go" : "assign"}" data-id="${r.id}"><div class="cat">${esc(r.cat || "")}</div><h3>${esc(r.name)}</h3>
    <div class="miss">${por ? `<b style="color:var(--accent)">${por} prepped</b> · ` : ""}${m.missing.length ? `Missing: <b>${esc(m.missing.map(i=>i.name).join(", "))}</b>` : "You have everything."}</div></button>`).join("");

function shopWeek(){
  {
      const need = {}, count = {};
      for (const x of weekItems()) if (!x.it.done) count[x.r.id] = (count[x.r.id] || 0) + 1;
      for (const [rid, n] of Object.entries(count)) {
        const times = n - portionsFor(rid); if (times <= 0) continue; // prepped portions cover it
        for (const ing of recipeById(rid).ingredients) { if (STAPLES.has(ing.name.toLowerCase()) || STAPLES.has(norm(ing.name))) continue;
          const key = norm(ing.name) + "|" + ing.unit; (need[key] ||= {name: ing.name, unit: ing.unit, qty: 0}).qty += ing.qty * times; } }
      const short = [];
      for (const n of Object.values(need)) { const p = findPantry(n.name);
        if (!p || p.qty <= 0) short.push(n);
        else { const have = convert(p.qty, p.unit, n.unit, n.name); if (have != null && have < n.qty) short.push({...n, qty: Math.round((n.qty - have)*100)/100}); } }
      const before = clone(state); const added = addToGrocery(short);
      if (!short.length) { toast("You have everything for this week's meals"); return; }
      undoSnap = before; ui.tab = "list"; ui.listStore = "all"; window.scrollTo(0, 0); commit(); toast(`${added || short.length} item${(added||short.length)===1?"":"s"} added to your list`, true); }
}

const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

function showAuth(msg, isErr){

  el.innerHTML = `<div class="card"><div class="brand">Kitchen Flow</div><h1>Sign in to sync your kitchen</h1>
    <p class="lead">Use the same email and password on your phone and computer to see the same lists, pantry and recipes.</p>
    <form data-form="auth">

      <label class="field">Password<input id="aPass" type="password" autocomplete="current-password" minlength="6"></label>
      ${msg ? `<div class="status ${isErr?"err":""}">${esc(msg)}</div>` : ""}
      <div class="actions"><button class="btn" type="submit" data-mode="in">Sign in</button><button class="btn ghost" type="submit" data-mode="up">Create account</button></div>
    </form>
    <button class="linkbtn" data-act="auth-reset">Forgot password?</button>

async function authSubmit(mode){

async function doSignOut(){

}
function listen(ref){

const hhKey = () => KEY + ":hh:" + (sync.user ? sync.user.uid : "");
async function findHousehold(){
  const email = (sync.user.email || "").toLowerCase();
  if (!email) return null;
  const q = sync.fb.query(sync.fb.collection(sync.db, "households"), sync.fb.where("memberEmails", "array-contains", email), sync.fb.limit(1));
  const res = await Promise.race([sync.fb.getDocs(q), new Promise((_, bad) => setTimeout(() => bad({code: "timeout"}), 6000))]);

}
function useDoc(hid){

  try { hid ? localStorage.setItem(hhKey(), hid) : localStorage.removeItem(hhKey()); } catch {}
  listen(hid ? sync.fb.doc(sync.db, "households", hid) : sync.fb.doc(sync.db, "users", sync.user.uid));
}
async function attach(user){
  if (sync.unsub) { sync.unsub(); sync.unsub = null; }
  sync.user = user; sync.docRef = null; sync.household = null;

  state = normalize(local && local.v ? local : (state && state.updated ? state : null));
  render();

  useDoc(hint);

async function startSharing(email){

async function stopSharing(){

async function boot(){

}
